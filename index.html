<head>

<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link rel="canonical" href="https://mihrap.uk/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mihrap">
<meta property="og:title" content="Mihrap — Namaz vakitleri, ezan ve tefekkür ekranı">
<meta property="og:description" content="Namaz vakitleri, vaktinde ezan ve tefekkür ekran koruyucusu. Akıllı TV, tablet, telefon ve bilgisayarda tarayıcıdan çalışır.">
<meta property="og:url" content="https://mihrap.uk/">
<meta property="og:image" content="https://mihrap.uk/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="tr_TR">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Mihrap","url":"https://mihrap.uk/",
"description":"Namaz vakitleri, vaktinde ezan ve tefekkür ekran koruyucusu. Akıllı TV, tablet, telefon ve bilgisayarda tarayıcıdan çalışır.",
"applicationCategory":"LifestyleApplication","operatingSystem":"Web tarayıcısı","inLanguage":["tr","en","de","ar","fa","id","ms","zh","ur","hi"],
"image":"https://mihrap.uk/img/og.jpg","offers":{"@type":"Offer","price":"0","priceCurrency":"GBP"}}
</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#faf1e1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mihrap">
<link rel="stylesheet" href="css/app.css?v=20">
</head>
<body>
<div id="frame">
<div id="stage">

  <!-- Home: photo layer + everything else drawn like the tablet (MainActivity / SkyHomeView) -->
  <div id="home" class="screen">
    <div id="homePhoto"></div>
    <canvas id="homeCanvas" width="1920" height="1080"></canvas>
    <div id="actionRow" class="hidden">
      <button id="actAdhan" class="nav action"><span class="icon" id="icAdhan"></span><span class="lbl" id="lblAdhan"></span></button>
      <button id="actTesbihat" class="nav action hidden"><span class="icon" id="icTesbihat"></span><span class="lbl" id="lblTesbihat"></span></button>
      <button id="actSettings" class="nav action"><span class="icon" id="icSettings"></span><span class="lbl" id="lblSettings"></span></button>
      <button id="actClose" class="nav action"><span class="icon" id="icClose"></span><span class="lbl" id="lblClose"></span></button>
    </div>
    <button id="menuToggle" class="nav" aria-label="Menu">&#9654;&#xFE0E;</button>
  </div>

  <!-- Screensaver: two slide canvases plus the overlay footer (SkyHomeView.drawSlideDisc) -->
  <div id="saver" class="screen hidden">
    <canvas id="slideA" width="1920" height="1080"></canvas>
    <canvas id="slideB" width="1920" height="1080"></canvas>
    <canvas id="saverOverlay" width="1920" height="1080"></canvas>
  </div>

  <!-- Adhan: world mosque photos with a caption, as on the tablet -->
  <div id="adhan" class="layer hidden">
    <div id="adhanPhoto"></div>
    <div id="adhanCaption"></div>
    <button id="adhanStop" class="nav" aria-label="Stop"></button>
  </div>

  <!-- Reminder overlay (eventOverlay) -->
  <div id="eventOverlay" class="hidden">
    <div id="eventTitle"></div>
    <div id="eventSubtitle"></div>
  </div>

  <!-- Settings -->
  <div id="settings" class="screen hidden">
    <h1 id="settingsTitle"></h1>
    <div id="settingsBody"></div>
    <div class="settingsButtons">
      <button id="saveSettings" class="nav big primary"></button>
      <button id="cancelSettings" class="nav big"></button>
      <button id="openCredits" class="nav big"></button>
      <button id="resetSettings" class="nav big danger"></button>
    </div>
  </div>

  <!-- Picker (long lists: countries, cities, districts) -->
  <div id="picker" class="layer hidden">
    <div class="pickerBox">
      <h2 id="pickerTitle"></h2>
      <div id="pickerLetters"></div>
      <div id="pickerList"></div>
    </div>
  </div>

  <!-- Credits -->
  <div id="credits" class="layer hidden">
    <div class="creditsBox">
      <h2 id="creditsTitle"></h2>
      <div id="creditsList"></div>
      <button id="closeCredits" class="nav big"></button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>

  <!-- Start: one press unlocks sound in the TV browser -->
  <div id="start" class="layer">
    <img class="startArt" src="img/mihrap.jpg" width="640" height="640" alt="Mihrap simgesi: mihrap kemeri">
    <div class="startBox">
      <h1 class="startLogo">Mihrap</h1>
      <p class="startTagline" id="startTagline">Namaz vakitleri, ezan ve tefekkür ekranı</p>
      <ul class="startFacts" id="startFacts">
        <li>Diyanet vakitleri veya 14 hesaplama yöntemi</li>
        <li>Vaktinde ezan; isteğe bağlı dua ve tesbihat</li>
        <li>Tefekkür ekran koruyucusu: ayet, hadis ve Esmâ-ül Hüsnâ</li>
        <li>Akıllı TV, tablet, telefon ve bilgisayarda; 10 dil</li>
      </ul>
      <button id="startButton" class="nav big primary">Başlat</button>
      <div id="startHint"></div>
    </div>
  </div>
</div>
</div>

<audio id="player" preload="none"></audio>
<audio id="cue" preload="none"></audio>
<script src="data/config.js?v=20"></script>
<script src="js/app.js?v=20"></script>
</body>
</html>
